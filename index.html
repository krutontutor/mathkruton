<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ฝึกคิดเลขไว 1 นาที | ติวกะพี่ต้น</title>
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 12px; background: #f3f6fa; color: #1e293b; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .app { width: 100%; max-width: 440px; background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    .hidden { display: none !important; }
    h1 { font-size: 22px; text-align: center; margin: 0 0 6px; color: #0f172a; }
    .subtitle { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, select { width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 14px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #2563eb; }
    .btn { width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: transform 0.05s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }

    /* Drill Screen */
    .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; }
    .timer-badge { background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 999px; font-size: 14px; }
    .progress-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: #2563eb; width: 100%; transition: width 0.2s linear; }
    .question-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 18px 14px; text-align: center; margin-bottom: 12px; min-height: 104px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .question-hint { font-size: 13px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
    .question-text { font-size: 32px; font-weight: 800; color: #0f172a; letter-spacing: 0.5px; line-height: 1.3; }
    .question-text.word-problem { font-size: 19px; font-weight: 700; text-align: left; line-height: 1.55; letter-spacing: 0; width: 100%; }
    .answer-display { width: 100%; height: 52px; background: #fff; border: 2px solid #94a3b8; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #2563eb; margin-bottom: 12px; }

    /* Keypad */
    .extra-keys { display: flex; gap: 10px; margin-bottom: 10px; }
    .extra-keys .key { flex: 1; padding: 10px 0; font-size: 19px; background: #e0e7ff; color: #1e40af; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key { padding: 14px 0; font-size: 24px; font-weight: 700; border: none; border-radius: 14px; background: #f1f5f9; color: #0f172a; cursor: pointer; }
    .key:active { background: #cbd5e1; }
    .key-del { background: #fee2e2; color: #dc2626; font-size: 18px; }
    .key-ok { background: #16a34a; color: #fff; font-size: 18px; }

    /* Summary */
    .score-big { font-size: 46px; font-weight: 800; color: #2563eb; text-align: center; margin: 10px 0; }
    .stat-card { background: #f8fafc; border-radius: 14px; padding: 14px; margin-bottom: 10px; font-size: 15px; line-height: 1.7; }
    .save-status { text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 14px; min-height: 20px; }
    .cta-box { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 14px; text-align: center; font-size: 14px; color: #1e40af; }
    .cta-box a { display: inline-block; margin-top: 8px; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app">
    <!-- หน้าแรก: ลงชื่อ -->
    <div id="screen-start">
      <h1>ฝึกคิดเลขไว | ติวกะพี่ต้น</h1>
      <div class="subtitle">ทำต่อเนื่อง 5 ชุด • บันทึกสถิติอัตโนมัติ</div>

      <label for="nickname">ชื่อเล่นนักเรียน</label>
      <input type="text" id="nickname" placeholder="เช่น น้องต้นกล้า">

      <label for="grade">ระดับชั้น / โหมดฝึก</label>
      <select id="grade">
        <option value="ป.1">ป.1 (บวก-ลบ จำนวนเต็ม • 15 ข้อ 1 นาที)</option>
        <option value="ป.2-ป.3">ป.2 – ป.3 (บวก ลบ คูณ หาร • 15 ข้อ 1 นาที)</option>
        <option value="ป.4-ป.5">ป.4 – ป.5 (จำนวนเต็ม ทศนิยม เศษส่วน • 15 ข้อ 1 นาที)</option>
        <option value="ป.6">ป.6 คิดเลขไว (จำนวนเต็ม ทศนิยม เศษส่วน • 15 ข้อ 1 นาที)</option>
        <option value="ป.6 โจทย์ปัญหา">ป.6 โจทย์ปัญหาคิดในใจ (แพทเทิร์นสอบเข้า • 5 ข้อ 2 นาที)</option>
        <option value="ม.1-ม.3">ม.1 – ม.3 (พหุนาม • 15 ข้อ 1 นาที)</option>
      </select>

      <label for="level">ระดับความยาก (Level)</label>
      <select id="level">
        <option value="Lv.1">Lv.1 — พื้นฐาน (ฝึกความคุ้นเคย)</option>
        <option value="Lv.2">Lv.2 — ปานกลาง (เพิ่มความซับซ้อน)</option>
        <option value="Lv.3">Lv.3 — ท้าทาย (ระดับแข่งขัน/สอบเข้า)</option>
      </select>

      <button class="btn btn-primary" onclick="startSession()">เริ่มฝึกชุดที่ 1 / 5</button>
    </div>

    <!-- หน้าทำโจทย์ -->
    <div id="screen-drill" class="hidden">
      <div class="top-bar">
        <span id="set-label">ชุดที่ 1/5</span>
        <span id="q-label">ข้อ 1/15</span>
        <span class="timer-badge" id="timer-text">60 วิ</span>
      </div>
      <div class="progress-bg"><div class="progress-fill" id="timer-bar"></div></div>
      <div class="question-box">
        <div class="question-hint" id="question-hint"></div>
        <div class="question-text" id="question-text">12 + 8 = ?</div>
      </div>
      <div class="answer-display" id="answer-display"></div>

      <div class="extra-keys hidden" id="extra-keys">
        <button class="key hidden" id="key-minus" onclick="pressKey('-')">- (ลบ)</button>
        <button class="key hidden" id="key-dot" onclick="pressKey('.')">. (จุด)</button>
        <button class="key hidden" id="key-slash" onclick="pressKey('/')">/ (เศษส่วน)</button>
      </div>

      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key key-del" onclick="delKey()">ลบ</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key key-ok" onclick="submitAnswer()">ตกลง</button>
      </div>
    </div>

    <!-- หน้าสรุปจบแต่ละชุด -->
    <div id="screen-set-done" class="hidden">
      <h1 id="set-done-title">จบชุดที่ 1 / 5</h1>
      <div class="score-big" id="set-score">15 / 15</div>
      <div class="stat-card" id="set-stat"></div>
      <div class="save-status" id="set-save-status"></div>
      <button class="btn btn-success" id="next-set-btn" onclick="nextSet()">ลุยชุดที่ 2 / 5 ต่อเลย!</button>
    </div>

    <!-- หน้าสรุปจบครบ 5 ชุด -->
    <div id="screen-final" class="hidden">
      <h1>เก่งมาก! ฝึกครบ 5 ชุดแล้ว</h1>
      <div class="score-big" id="final-score">75 / 75</div>
      <div class="stat-card" id="final-stat"></div>
      <div class="save-status" id="final-save-status"></div>
      <button class="btn btn-primary" onclick="location.reload()">ฝึกใหม่อีกครั้ง</button>
      <div class="cta-box">
        ฝึกคิดเลขคล่องแล้ว อยากต่อยอดโจทย์แข่งขันและปรับพื้นฐาน?<br>
        <a href="https://www.krutontutor.com" target="_blank">ดูคอร์สเรียนที่ krutontutor.com</a>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGZfr4SpJtZqbWwA3Vd7bIGb9Ll7hyFyZvJa3iYi8NA-p5lhH-XDUTHCGw8oEcrOOEqQ/exec';
    const TOTAL_SETS = 5;

    let questionsPerSet = 15;
    let timeLimit = 60;

    let studentName = localStorage.getItem('kt_name') || '';
    let studentGrade = localStorage.getItem('kt_grade') || 'ป.6 โจทย์ปัญหา';
    let studentLevel = localStorage.getItem('kt_level') || 'Lv.1';

    let currentSet = 1;
    let currentQ = 0;
    let questions = [];
    let currentInput = '';
    let setScore = 0;
    let totalScore = 0;
    let totalTimeUsed = 0;
    let timeLeft = 60;
    let timerId = null;

    if (studentName) document.getElementById('nickname').value = studentName;
    if (studentGrade) document.getElementById('grade').value = studentGrade;
    if (studentLevel) document.getElementById('level').value = studentLevel;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(arr) {
      return arr[rand(0, arr.length - 1)];
    }

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) { let t = b; b = a % b; a = t; }
      return a;
    }

    function setupExtraKeys(grade) {
      const box = document.getElementById('extra-keys');
      const kMinus = document.getElementById('key-minus');
      const kDot = document.getElementById('key-dot');
      const kSlash = document.getElementById('key-slash');
      [box, kMinus, kDot, kSlash].forEach(el => el.classList.add('hidden'));

      if (grade === 'ป.4-ป.5') {
        box.classList.remove('hidden');
        kDot.classList.remove('hidden');
        kSlash.classList.remove('hidden');
      } else if (grade === 'ป.6') {
        box.classList.remove('hidden');
        kMinus.classList.remove('hidden');
        kDot.classList.remove('hidden');
        kSlash.classList.remove('hidden');
      } else if (grade === 'ม.1-ม.3') {
        box.classList.remove('hidden');
        kMinus.classList.remove('hidden');
      }
    }

    function generateP6WordProblem(lv) {
      let text = '', ans = '', hint = 'ตอบเฉพาะตัวเลข (ไม่ต้องใส่หน่วย)';

      if (lv === 1) {
        const type = rand(0, 3);
        if (type === 0) {
          // ลดราคา
          const price = pick([200, 300, 400, 500, 600, 800, 1000, 1200]);
          const disc = pick([10, 20, 25, 50]);
          text = `เสื้อราคา ${price} บาท ร้านค้าลดราคาให้ ${disc}% ผู้ซื้อต้องจ่ายเงินกี่บาท`;
          ans = String(price - (price * disc) / 100);
        } else if (type === 1) {
          // อัตราส่วนอย่างง่าย
          const a = rand(2, 5), b = rand(2, 6);
          const k = rand(3, 9);
          text = `อัตราส่วนของจำนวนปากกาต่อดินสอคือ ${a} : ${b} ถ้ามีปากกา ${a * k} ด้าม จะมีดินสอกี่แท่ง`;
          ans = String(b * k);
        } else if (type === 2) {
          // อัตราเร็ว-ระยะทาง
          const v = pick([40, 50, 60, 70, 80, 90]);
          const t = rand(2, 5);
          text = `รถยนต์แล่นด้วยอัตราเร็วเฉลี่ย ${v} กิโลเมตรต่อชั่วโมง เป็นเวลา ${t} ชั่วโมง จะได้ระยะทางกี่กิโลเมตร`;
          ans = String(v * t);
        } else {
          // อายุรวม
          const y = rand(7, 14), diff = rand(3, 8);
          text = `พี่อายุมากกว่าน้อง ${diff} ปี ถ้าน้องอายุ ${y} ปี ทั้งสองคนจะมีอายุรวมกันกี่ปี`;
          ans = String(y + (y + diff));
        }
      } else if (lv === 2) {
        const type = rand(0, 3);
        if (type === 0) {
          // กำไร-ราคาขาย
          const cost = pick([200, 300, 400, 500, 600, 800, 1000]);
          const profit = pick([10, 20, 25, 30, 40, 50]);
          text = `ร้านค้าซื้อกระเป๋ามาราคา ${cost} บาท ต้องการขายให้ได้กำไร ${profit}% ต้องตั้งราคาขายกี่บาท`;
          ans = String(cost + (cost * profit) / 100);
        } else if (type === 1) {
          // ผลบวก-ผลต่าง
          const x = rand(15, 45), y = rand(5, x - 4);
          const sum = x + y, diff = x - y;
          const askMax = rand(0, 1) === 0;
          text = `จำนวนสองจำนวนรวมกันได้ ${sum} และมีผลต่างเท่ากับ ${diff} จำนวนที่${askMax ? 'มากกว่า' : 'น้อยกว่า'}คือเท่าใด`;
          ans = String(askMax ? x : y);
        } else if (type === 2) {
          // ค่าเฉลี่ย 3 ครั้ง
          const avg = rand(70, 90);
          const x1 = avg + rand(-10, 10);
          const x2 = avg + rand(-10, 10);
          const x3 = avg * 3 - x1 - x2;
          text = `นักเรียนสอบคณิตศาสตร์ 3 ครั้ง ได้คะแนนเฉลี่ย ${avg} คะแนน ถ้าสองครั้งแรกได้ ${x1} และ ${x2} คะแนน ครั้งที่สามได้กี่คะแนน`;
          ans = String(x3);
        } else {
          // แปรผกผัน (คนงาน)
          const pairs = [[4, 6, 3], [6, 4, 8], [3, 8, 4], [5, 6, 3], [4, 9, 6], [6, 5, 10]];
          const [w1, d1, w2] = pick(pairs);
          text = `คนงาน ${w1} คน ช่วยกันทาสีบ้านเสร็จภายใน ${d1} วัน ถ้าใช้คนงาน ${w2} คน จะทาสีบ้านเสร็จภายในกี่วัน`;
          ans = String((w1 * d1) / w2);
        }
      } else {
        // Lv.3 ท้าทาย (คิดในใจได้)
        const type = rand(0, 3);
        if (type === 0) {
          // ย้อนหาราคาทุน
          const sets = [
            { p: 20, mult: 120, costUnit: 100 },
            { p: 25, mult: 125, costUnit: 100 },
            { p: 50, mult: 150, costUnit: 100 },
            { p: 10, mult: 110, costUnit: 100 }
          ];
          const s = pick(sets);
          const k = rand(2, 6);
          const sell = s.mult * k;
          const cost = s.costUnit * k;
          text = `ขายสินค้าไปราคา ${sell} บาท ได้กำไร ${s.p}% เดิมซื้อสินค้านี้มาราคากี่บาท`;
          ans = String(cost);
        } else if (type === 1) {
          // จำนวนเต็มเรียงติดกัน 3 จำนวน
          const mid = rand(12, 40);
          const askMax = rand(0, 1) === 0;
          text = `จำนวนเต็มเรียงติดกัน 3 จำนวน มีผลรวมเท่ากับ ${mid * 3} จำนวนที่${askMax ? 'มากที่สุด' : 'น้อยที่สุด'}คือเท่าใด`;
          ans = String(askMax ? mid + 1 : mid - 1);
        } else if (type === 2) {
          // แบ่งเงินตามอัตราส่วน
          const a = rand(2, 5), b = rand(2, 5);
          if (a === b) return generateP6WordProblem(lv);
          const unit = pick([20, 50, 100]);
          const total = (a + b) * unit;
          text = `แบ่งเงิน ${total} บาท ให้สมชายและสมหญิงในอัตราส่วน ${a} : ${b} สมหญิงได้รับเงินกี่บาท`;
          ans = String(b * unit);
        } else {
          // เศษส่วนย้อนหาของเดิม
          const d = pick([3, 4, 5, 6, 7, 8]);
          const n = rand(1, d - 1);
          const remParts = d - n;
          const k = rand(3, 12);
          const rem = remParts * k;
          text = `เชือกเส้นหนึ่งตัดไปใช้ ${n}/${d} ของความยาวทั้งหมด ยังเหลือเชือกยาว ${rem} เมตร เดิมเชือกเส้นนี้ยาวกี่เมตร`;
          ans = String(d * k);
        }
      }
      return { hint, text, ans, isWord: true };
    }

    function generateQuestions(grade, levelStr) {
      const lv = parseInt(levelStr.replace('Lv.', ''), 10) || 1;
      const list = [];

      for (let i = 0; i < questionsPerSet; i++) {
        if (grade === 'ป.6 โจทย์ปัญหา') {
          list.push(generateP6WordProblem(lv));
          continue;
        }

        let hint = '', text = '', ans = '';

        if (grade === 'ป.1') {
          const maxNum = lv === 1 ? 10 : (lv === 2 ? 20 : 50);
          if (rand(0, 1) === 0) {
            const a = rand(1, maxNum), b = rand(1, maxNum);
            text = `${a} + ${b} = ?`; ans = String(a + b);
          } else {
            const a = rand(5, maxNum + 10), b = rand(1, a);
            text = `${a} - ${b} = ?`; ans = String(a - b);
          }
        }
        else if (grade === 'ป.2-ป.3') {
          const type = rand(0, lv === 1 ? 2 : 3);
          const maxAdd = lv === 1 ? 50 : (lv === 2 ? 99 : 250);
          if (type === 0) {
            const a = rand(12, maxAdd), b = rand(11, maxAdd);
            text = `${a} + ${b} = ?`; ans = String(a + b);
          } else if (type === 1) {
            const a = rand(30, maxAdd + 30), b = rand(11, a - 5);
            text = `${a} - ${b} = ?`; ans = String(a - b);
          } else if (type === 2) {
            const maxMul = lv === 1 ? 9 : (lv === 2 ? 12 : 15);
            const a = rand(2, maxMul), b = rand(2, 12);
            text = `${a} × ${b} = ?`; ans = String(a * b);
          } else {
            const b = rand(2, lv === 3 ? 12 : 9), q = rand(2, 12);
            text = `${b * q} ÷ ${b} = ?`; ans = String(q);
          }
        }
        else if (grade === 'ป.4-ป.5') {
          const type = rand(0, 2);
          if (type === 0) {
            const a = rand(2, 15 * lv), b = rand(2, 9), c = rand(2, 9);
            text = lv === 3 ? `${a} + ${b} × ${c} - ${rand(1, 9)} = ?` : `${a} + ${b} × ${c} = ?`;
            if (lv === 3) {
              const d = rand(1, 9);
              text = `${a} + ${b} × ${c} - ${d} = ?`;
              ans = String(a + b * c - d);
            } else {
              ans = String(a + b * c);
            }
          } else if (type === 1) {
            const a = rand(11, 50 * lv), b = rand(5, 40 * lv);
            if (rand(0, 1) === 0) {
              text = `${(a / 10).toFixed(1)} + ${(b / 10).toFixed(1)} = ?`;
              ans = String(Number(((a + b) / 10).toFixed(1)));
            } else {
              const big = Math.max(a, b), small = Math.min(a, b);
              text = `${(big / 10).toFixed(1)} - ${(small / 10).toFixed(1)} = ?`;
              ans = String(Number(((big - small) / 10).toFixed(1)));
            }
          } else {
            const d = pick([2, 3, 4, 5, 6, 8, 10]);
            const n1 = rand(1, d - 1), n2 = rand(1, d - 1);
            const sum = n1 + n2, g = gcd(sum, d);
            hint = 'ตอบเป็นจำนวนเต็ม หรือเศษส่วนอย่างต่ำ';
            text = `${n1}/${d} + ${n2}/${d} = ?`;
            ans = (d / g === 1) ? String(sum / g) : `${sum / g}/${d / g}`;
          }
        }
        else if (grade === 'ป.6') {
          const type = rand(0, 2);
          if (type === 0) {
            const range = 10 * lv;
            const a = rand(-range, range), b = rand(2, range);
            text = `${a} - ${b} = ?`; ans = String(a - b);
          } else if (type === 1) {
            const a = rand(2, 12 * lv), b = rand(2, 9);
            text = `${(a / 10).toFixed(1)} × ${b} = ?`;
            ans = String(Number(((a * b) / 10).toFixed(1)));
          } else {
            const d1 = rand(2, 6), d2 = rand(2, 6);
            const n1 = rand(1, 5), n2 = rand(1, 5);
            const num = n1 * n2, den = d1 * d2, g = gcd(num, den);
            hint = 'ตอบเป็นจำนวนเต็ม หรือเศษส่วนอย่างต่ำ';
            text = `${n1}/${d1} × ${n2}/${d2} = ?`;
            ans = (den / g === 1) ? String(num / g) : `${num / g}/${den / g}`;
          }
        }
        else if (grade === 'ม.1-ม.3') {
          const type = rand(0, 2);
          const lim = lv === 1 ? 6 : (lv === 2 ? 10 : 15);
          if (type === 0) {
            const a = rand(-lim, lim) || 2, b = rand(-lim, lim) || 3;
            hint = 'หาสัมประสิทธิ์ของ x';
            text = `(${a}x + 4) + (${b}x - 2)`;
            ans = String(a + b);
          } else if (type === 1) {
            const r1 = rand(1, lim), r2 = rand(1, lim);
            hint = 'จงหาค่า a';
            text = `x² + ${r1 + r2}x + ${r1 * r2} = (x + ${r1})(x + a)`;
            ans = String(r2);
          } else {
            const a = rand(-lim, lim) || 2, b = rand(-lim, lim) || -3;
            const aStr = a > 0 ? `+ ${a}` : `- ${Math.abs(a)}`;
            const bStr = b > 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
            hint = 'หาพจน์ค่าคงตัวจากการคูณ';
            text = `(x ${aStr})(x ${bStr})`;
            ans = String(a * b);
          }
        }

        list.push({ hint, text, ans, isWord: false });
      }
      return list;
    }

    function showScreen(id) {
      ['screen-start', 'screen-drill', 'screen-set-done', 'screen-final'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    function sendRecord(setNo, score, total, timeUsed, statusElId) {
      const statusEl = document.getElementById(statusElId);
      statusEl.textContent = '⏳ กำลังบันทึกคะแนน...';
      statusEl.style.color = '#64748b';

      const payload = {
        name: studentName,
        grade: `${studentGrade} (${studentLevel})`,
        setNo: `ชุดที่ ${setNo}/${TOTAL_SETS}`,
        score: score,
        total: total,
        timeUsed: timeUsed
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusEl.textContent = '✅ บันทึกคะแนนเข้าระบบเรียบร้อย';
        statusEl.style.color = '#16a34a';
      })
      .catch(() => {
        statusEl.textContent = '⚠️ บันทึกไม่สำเร็จ (โปรดเช็กอินเทอร์เน็ต)';
        statusEl.style.color = '#dc2626';
      });
    }

    function startSession() {
      const nameInput = document.getElementById('nickname').value.trim();
      studentName = nameInput || 'นักเรียน';
      studentGrade = document.getElementById('grade').value;
      studentLevel = document.getElementById('level').value;

      localStorage.setItem('kt_name', studentName);
      localStorage.setItem('kt_grade', studentGrade);
      localStorage.setItem('kt_level', studentLevel);

      if (studentGrade === 'ป.6 โจทย์ปัญหา') {
        questionsPerSet = 5;
        timeLimit = 120;
      } else {
        questionsPerSet = 15;
        timeLimit = 60;
      }

      setupExtraKeys(studentGrade);
      currentSet = 1;
      totalScore = 0;
      totalTimeUsed = 0;
      startSet();
    }

    function startSet() {
      questions = generateQuestions(studentGrade, studentLevel);
      currentQ = 0;
      setScore = 0;
      currentInput = '';
      timeLeft = timeLimit;
      showScreen('screen-drill');
      updateUI();
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-text').textContent = `${timeLeft} วิ`;
        document.getElementById('timer-bar').style.width = `${(timeLeft / timeLimit) * 100}%`;
        if (timeLeft <= 0) finishSet();
      }, 1000);
    }

    function updateUI() {
      const q = questions[currentQ];
      document.getElementById('set-label').textContent = `${studentGrade} (${studentLevel}) • ชุด ${currentSet}/${TOTAL_SETS}`;
      document.getElementById('q-label').textContent = `ข้อ ${currentQ + 1}/${questionsPerSet}`;
      document.getElementById('timer-text').textContent = `${timeLeft} วิ`;
      document.getElementById('timer-bar').style.width = `${(timeLeft / timeLimit) * 100}%`;
      document.getElementById('question-hint').textContent = q.hint;

      const qTextEl = document.getElementById('question-text');
      qTextEl.textContent = q.text;
      if (q.isWord) {
        qTextEl.classList.add('word-problem');
      } else {
        qTextEl.classList.remove('word-problem');
      }
      document.getElementById('answer-display').textContent = currentInput;
    }

    function pressKey(ch) {
      if (currentInput.length >= 8) return;
      if (ch === '-' && currentInput.length > 0) return;
      if (ch === '.' && currentInput.includes('.')) return;
      if (ch === '/' && currentInput.includes('/')) return;
      currentInput += ch;
      document.getElementById('answer-display').textContent = currentInput;
    }

    function delKey() {
      currentInput = currentInput.slice(0, -1);
      document.getElementById('answer-display').textContent = currentInput;
    }

    function checkAnswer(userStr, correctStr) {
      if (userStr === correctStr) return true;
      if (!userStr.includes('/') && !correctStr.includes('/')) {
        const u = parseFloat(userStr), c = parseFloat(correctStr);
        if (!isNaN(u) && !isNaN(c) && Math.abs(u - c) < 1e-9) return true;
      }
      return false;
    }

    function submitAnswer() {
      if (currentInput === '' || currentInput === '-') return;
      if (checkAnswer(currentInput, questions[currentQ].ans)) setScore++;
      currentInput = '';
      currentQ++;
      if (currentQ >= questionsPerSet) {
        finishSet();
      } else {
        updateUI();
      }
    }

    function finishSet() {
      clearInterval(timerId);
      const used = timeLimit - timeLeft;
      totalScore += setScore;
      totalTimeUsed += used;

      if (currentSet < TOTAL_SETS) {
        document.getElementById('set-done-title').textContent = `จบชุดที่ ${currentSet} / ${TOTAL_SETS}`;
        document.getElementById('set-score').textContent = `${setScore} / ${questionsPerSet}`;
        document.getElementById('set-stat').innerHTML = `
          👤 น้อง: <b>${studentName}</b> (${studentGrade} ${studentLevel})<br>
          ⏱️ ใช้เวลาไป: <b>${used} วินาที</b>
        `;
        document.getElementById('next-set-btn').textContent = `ลุยชุดที่ ${currentSet + 1} / ${TOTAL_SETS} ต่อเลย!`;
        showScreen('screen-set-done');
        sendRecord(currentSet, setScore, questionsPerSet, used, 'set-save-status');
      } else {
        const maxTotal = TOTAL_SETS * questionsPerSet;
        document.getElementById('final-score').textContent = `${totalScore} / ${maxTotal}`;
        document.getElementById('final-stat').innerHTML = `
          👤 น้อง: <b>${studentName}</b> (${studentGrade} ${studentLevel})<br>
          ⏱️ เวลารวม 5 ชุด: <b>${totalTimeUsed} วินาที</b><br>
          🎯 ความแม่นยำ: <b>${Math.round((totalScore / maxTotal) * 100)}%</b>
        `;
        showScreen('screen-final');
        sendRecord(currentSet, setScore, questionsPerSet, used, 'final-save-status');
      }
    }

    function nextSet() {
      currentSet++;
      startSet();
    }
  </script>
</body>
</html>
