<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ฝึกคิดเลขไว 1 นาที | ติวกะพี่ต้น</title>
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 12px; background: #f3f6fa; color: #1e293b; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .app { width: 100%; max-width: 440px; background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    .hidden { display: none !important; }
    h1 { font-size: 22px; text-align: center; margin: 0 0 6px; color: #0f172a; }
    .subtitle { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, select { width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 14px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #2563eb; }
    .btn { width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: transform 0.05s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }

    /* Drill Screen */
    .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; }
    .timer-badge { background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 999px; font-size: 14px; }
    .progress-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: #2563eb; width: 100%; transition: width 0.2s linear; }
    .question-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 18px 14px; text-align: center; margin-bottom: 12px; min-height: 104px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .question-hint { font-size: 13px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
    .question-text { font-size: 32px; font-weight: 800; color: #0f172a; letter-spacing: 0.5px; line-height: 1.3; }
    .question-text.word-problem { font-size: 19px; font-weight: 700; text-align: left; line-height: 1.55; letter-spacing: 0; width: 100%; }
    .answer-display { width: 100%; height: 52px; background: #fff; border: 2px solid #94a3b8; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #2563eb; margin-bottom: 12px; }

    /* Keypad */
    .extra-keys { display: flex; gap: 10px; margin-bottom: 10px; }
    .extra-keys .key { flex: 1; padding: 10px 0; font-size: 19px; background: #e0e7ff; color: #1e40af; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key { padding: 14px 0; font-size: 24px; font-weight: 700; border: none; border-radius: 14px; background: #f1f5f9; color: #0f172a; cursor: pointer; }
    .key:active { background: #cbd5e1; }
    .key-del { background: #fee2e2; color: #dc2626; font-size: 18px; }
    .key-ok { background: #16a34a; color: #fff; font-size: 18px; }

    /* Summary */
    .score-big { font-size: 46px; font-weight: 800; color: #2563eb; text-align: center; margin: 10px 0; }
    .stat-card { background: #f8fafc; border-radius: 14px; padding: 14px; margin-bottom: 10px; font-size: 15px; line-height: 1.7; }
    .save-status { text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 14px; min-height: 20px; }
    .cta-box { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 14px; text-align: center; font-size: 14px; color: #1e40af; }
    .cta-box a { display: inline-block; margin-top: 8px; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app">
    <!-- หน้าแรก: ลงชื่อ -->
    <div id="screen-start">
      <h1>ฝึกคิดเลขไว | ติวกะพี่ต้น</h1>
      <div class="subtitle">ทำต่อเนื่อง 5 ชุด • บันทึกสถิติอัตโนมัติ</div>

      <label for="nickname">ชื่อเล่นนักเรียน</label>
      <input type="text" id="nickname" placeholder="เช่น น้องต้นกล้า">

      <label for="grade">ระดับชั้น / โหมดฝึก</label>
      <select id="grade">
        <option value="ป.1">ป.1 (บวก-ลบ จำนวนเต็ม • 15 ข้อ 1 นาที)</option>
        <option value="ป.2-ป.3">ป.2 – ป.3 (บวก ลบ คูณ หาร • 15 ข้อ 1 นาที)</option>
        <option value="ป.4-ป.5">ป.4 – ป.5 (จำนวนเต็ม ทศนิยม เศษส่วน • 15 ข้อ 1 นาที)</option>
        <option value="ป.6">ป.6 คิดเลขไว (จำนวนเต็ม ทศนิยม เศษส่วน • 15 ข้อ 1 นาที)</option>
        <option value="ป.6 โจทย์ปัญหา">ป.6 โจทย์ปัญหาคิดในใจ (แพทเทิร์นสอบเข้า • 5 ข้อ 2 นาที)</option>
        <option value="ม.1-ม.3">ม.1 – ม.3 (พหุนาม • 15 ข้อ 1 นาที)</option>
      </select>

      <label for="level">ระดับความยาก (Level)</label>
      <select id="level">
        <option value="Lv.1">Lv.1 — พื้นฐาน (ฝึกความคุ้นเคย)</option>
        <option value="Lv.2">Lv.2 — ปานกลาง (เพิ่มความซับซ้อน)</option>
        <option value="Lv.3">Lv.3 — ท้าทาย (ระดับแข่งขัน/สอบเข้า)</option>
      </select>

      <button class="btn btn-primary" onclick="startSession()">เริ่มฝึกชุดที่ 1 / 5</button>
    </div>

    <!-- หน้าทำโจทย์ -->
    <div id="screen-drill" class="hidden">
      <div class="top-bar">
        <span id="set-label">ชุดที่ 1/5</span>
        <span id="q-label">ข้อ 1/15</span>
        <span class="timer-badge" id="timer-text">60 วิ</span>
      </div>
      <div class="progress-bg"><div class="progress-fill" id="timer-bar"></div></div>
      <div class="question-box">
        <div class="question-hint" id="question-hint"></div>
        <div class="question-text" id="question-text">12 + 8 = ?</div>
      </div>
      <div class="answer-display" id="answer-display"></div>

      <div class="extra-keys hidden" id="extra-keys">
        <button class="key hidden" id="key-minus" onclick="pressKey('-')">- (ลบ)</button>
        <button class="key hidden" id="key-dot" onclick="pressKey('.')">. (จุด)</button>
        <button class="key hidden" id="key-slash" onclick="pressKey('/')">/ (เศษส่วน)</button>
      </div>

      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key key-del" onclick="delKey()">ลบ</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key key-ok" onclick="submitAnswer()">ตกลง</button>
      </div>
    </div>

    <!-- หน้าสรุปจบแต่ละชุด -->
    <div id="screen-set-done" class="hidden">
      <h1 id="set-done-title">จบชุดที่ 1 / 5</h1>
      <div class="score-big" id="set-score">15 / 15</div>
      <div class="stat-card" id="set-stat"></div>
      <div class="save-status" id="set-save-status"></div>
      <button class="btn btn-success" id="next-set-btn" onclick="nextSet()">ลุยชุดที่ 2 / 5 ต่อเลย!</button>
    </div>

    <!-- หน้าสรุปจบครบ 5 ชุด -->
    <div id="screen-final" class="hidden">
      <h1>เก่งมาก! ฝึกครบ 5 ชุดแล้ว</h1>
      <div class="score-big" id="final-score">75 / 75</div>
      <div class="stat-card" id="final-stat"></div>
      <div class="save-status" id="final-save-status"></div>
      <button class="btn btn-primary" onclick="
